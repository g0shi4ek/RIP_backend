<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детали заявки</title>
    <link rel="stylesheet" href="/resources/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img class="vector" src="http://127.0.0.1:9000/charging-images/vector.svg" alt="Company Logo" width="100" height="60" />
            </div>
            <a href="/" class="icon">
                <img src="http://127.0.0.1:9000/charging-images/icons.svg" alt="User menu icons" width="30" height="30" />
            </a>
        </div>

        <div class="search-section">
            <div class="current-request">
                <div class="request-title">Текущая заявка</div>
                <div class="request-subtitle">Стоимость {{printf "%.2f" .application.Price}} ₽</div>
            </div>
        </div>

        <div class="details-section">
            {{range .tariffs }}
            <div class="order-card">
                <div class="service-card">
                    <div class="service-content">
                        <div class="service-title">{{.NameofTariff}}</div>
                        <div class="service-description">{{.Description}}</div>
                        <div class="service-price">{{.PricePerHour}} ₽/час</div>
                        <a href="/tariff/{{.Id}}" class="details-btn btn-hover">Подробнее</a>
                    </div>
                    <div class="service-image-container">
                        <img class="service-image" src="{{.ImageUrl}}" alt="{{.NameofTariff}}">
                    </div>
                </div>

                <div class="detail-card">
                    <div class="detail-row">
                        <div class="detail-input">
                            <div class="detail-field">57.16</div>
                        </div>
                        <div class="detail-label">Объем батареи</div>
                        <div class="time-section">
                            <div class="time-display">16:27</div>
                            <div class="time-label">Время начала</div>
                        </div>
                    </div>
                    
                    <div class="detail-row">
                        <div class="detail-input">
                            <div class="detail-field">20%</div>
                        </div>
                        <div class="detail-label">Уровень заряда</div>
                        <div class="cost-section">
                            <div class="cost-display">1000.00 ₽</div>
                            <div class="cost-label">Стоимость</div>
                        </div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-input">
                            <div class="detail-field">2:40</div>
                        </div>
                        <div class="detail-label">Время зарядки</div>
                    </div>
                </div>
            </div>
            {{end}}
        </div>

        <div class="footer">
            <div class="footer-content">
                <div class="footer-item">RIP © 2025</div>
                <div class="footer-item">Контакты</div>
                <div class="footer-item">Новости</div>
                <div class="footer-item">Расположение</div>
            </div>
        </div>
    </div>
</body>
</html>
