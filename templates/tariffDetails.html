<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детали тарифа - {{.tariff.NameofTariff}}</title>
    <link rel="stylesheet" href="../resources/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img class="vector" src="http://127.0.0.1:9000/charging-images/vector.svg" alt="Company Logo" width="100" height="60" />
            </div>
            <a href="/tariffs" class="icon">
                <img src="http://127.0.0.1:9000/charging-images/icons.svg" alt="User menu icons" width="30" height="30" />
            </a>
        </div>

        <div class="tariff-section">
            <div class="tariff-title">{{.tariff.NameofTariff}}</div>
            <div class="tariff-description">{{.tariff.Description}}</div>
            
            <img class="tariff-image" src="{{.tariff.ImageUrl}}" alt="{{.tariff.NameofTariff}}">
            
            <div class="power-display">
                <div class="power-value">{{printf "%.2f" .tariff.Power}} КВт</div>
            </div>
            
            <div class="price-section">
                <div class="price-value">{{printf "%.2f" .tariff.PricePerHour}} ₽/час</div>
                <div class="price-label">Цена тарифа за час</div>
            </div>
        </div>

        <div class="footer">
            <div class="footer-content">
                <div class="footer-item">RIP © 2025</div>
                <div class="footer-item">Контакты</div>
                <div class="footer-item">Новости</div>
                <div class="footer-item">Расположение</div>
            </div>
        </div>
    </div>
</body>
</html>
